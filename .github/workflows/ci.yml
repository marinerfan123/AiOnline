name: CI - Engineering Quality Gate

on:
  push:
    branches: [main, feat/commercial-generation-v2]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: moling_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Wait for PostgreSQL
        run: |
          for i in $(seq 1 30); do
            pg_isready -h localhost -p 5432 -U postgres && break
            sleep 2
          done

      - name: Initialize test schema
        env:
          NODE_ENV: test
          TEST_PG_DATABASE: moling_ci_test
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: moling_ci_test
        run: |
          node server/db/migrate.cjs

      - name: 1. Syntax check
        run: npm run check:syntax

      - name: 2. Typecheck
        run: npm run typecheck

      - name: 3. ESLint
        run: npm run lint:eslint

      - name: 4. Unit tests
        run: npm test

      - name: 5. V2 tests
        env:
          NODE_ENV: test
          TEST_PG_DATABASE: moling_ci_test
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: moling_ci_test
        run: npm run test:v2

      - name: 6. API integration tests
        env:
          NODE_ENV: test
          TEST_PG_DATABASE: moling_ci_test
          PG_HOST: localhost
          PG_PORT: 5432
          PG_USER: postgres
          PG_PASSWORD: postgres
          PG_DATABASE: moling_ci_test
        run: npm run test:api

      - name: 7. Build
        run: npm run build
