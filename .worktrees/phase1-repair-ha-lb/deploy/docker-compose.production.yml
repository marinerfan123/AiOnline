# Production Multi-Replica Deployment Configuration
#
# This compose file is for production deployment with:
# - Multiple API replicas (2+ nodes)
# - Multiple worker nodes
# - Nginx load balancer
# - Health checks for all services
# - Graceful shutdown support
#
# Usage:
#   docker compose -f deploy/docker-compose.production.yml up -d
#
# Phased deployment:
#   1) docker compose -f deploy/docker-compose.production.yml up -d nginx
#   2) docker compose -f deploy/docker-compose.production.yml up -d api-01 api-02
#   3) Verify /api/readiness on each API node
#   4) docker compose -f deploy/docker-compose.production.yml up -d worker-01 worker-02

services:
  # ── API Node 01 ──
  api-01:
    image: moling-app-v1:rc
    container_name: moling-v1-api-01
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENABLE_CLUSTER: "false"
      NODE_ID: api-01
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: huabu
      PG_USER: moling
      PG_SSLMODE: require
      PG_POOL_MAX: "20"
      PG_CONN_TIMEOUT_MS: "5000"
      PG_IDLE_TIMEOUT_MS: "30000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tv.moling.fun,https://kk.moling.fun}
      GENERATION_V2_WORKER_ENABLED: "false"
    ports:
      - "18001:3001"
    volumes:
      - /opt/moling-v1/v1-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ── API Node 02 ──
  api-02:
    image: moling-app-v1:rc
    container_name: moling-v1-api-02
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENABLE_CLUSTER: "false"
      NODE_ID: api-02
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: huabu
      PG_USER: moling
      PG_SSLMODE: require
      PG_POOL_MAX: "20"
      PG_CONN_TIMEOUT_MS: "5000"
      PG_IDLE_TIMEOUT_MS: "30000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tv.moling.fun,https://kk.moling.fun}
      GENERATION_V2_WORKER_ENABLED: "false"
    ports:
      - "18002:3001"
    volumes:
      - /opt/moling-v1/v1-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M

  # ── API Node 03 (Optional, for scaling) ──
  api-03:
    image: moling-app-v1:rc
    container_name: moling-v1-api-03
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "3001"
      ENABLE_CLUSTER: "false"
      NODE_ID: api-03
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: huabu
      PG_USER: moling
      PG_SSLMODE: require
      PG_POOL_MAX: "20"
      PG_CONN_TIMEOUT_MS: "5000"
      PG_IDLE_TIMEOUT_MS: "30000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tv.moling.fun,https://kk.moling.fun}
      GENERATION_V2_WORKER_ENABLED: "false"
    ports:
      - "18003:3001"
    volumes:
      - /opt/moling-v1/v1-data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/readiness').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 1G
        reservations:
          cpus: "0.5"
          memory: 256M
    # Comment out or remove if not needed
    # Uncomment in deploy command: docker compose -f deploy/docker-compose.production.yml up -d api-01 api-02 api-03

  # ── Worker Node 01 ──
  worker-01:
    image: moling-app-v1:rc
    container_name: moling-v1-worker-01
    env_file:
      - .env
    command: ["node", "server/modules/generation-v2/entry.cjs"]
    environment:
      NODE_ENV: production
      WORKER_ID: worker-01
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: huabu
      PG_USER: moling
      PG_SSLMODE: require
      V2_PG_POOL_MAX: "10"
      PG_CONN_TIMEOUT_MS: "5000"
      PG_IDLE_TIMEOUT_MS: "30000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GENERATION_V2_WORKER_ENABLED: "true"
      GENERATION_V2_EVIDENCE_FILE: /app/v2-evidence.json
      V2_GENERATION_CONCURRENCY: "10"
      V2_UPLOAD_CONCURRENCY: "4"
      V2_TICK_MS: "1000"
    volumes:
      - /opt/moling-v1/v2-evidence.json:/app/v2-evidence.json:ro
      - /opt/moling-v1/v1-data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const ioredis=require('ioredis');const r=new ioredis({host:'redis',port:6379});r.ping().then(()=>{r.disconnect();process.exit(0)}).catch(()=>process.exit(1))\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M

  # ── Worker Node 02 ──
  worker-02:
    image: moling-app-v1:rc
    container_name: moling-v1-worker-02
    env_file:
      - .env
    command: ["node", "server/modules/generation-v2/entry.cjs"]
    environment:
      NODE_ENV: production
      WORKER_ID: worker-02
      PG_HOST: postgres
      PG_PORT: "5432"
      PG_DATABASE: huabu
      PG_USER: moling
      PG_SSLMODE: require
      V2_PG_POOL_MAX: "10"
      PG_CONN_TIMEOUT_MS: "5000"
      PG_IDLE_TIMEOUT_MS: "30000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      GENERATION_V2_WORKER_ENABLED: "true"
      GENERATION_V2_EVIDENCE_FILE: /app/v2-evidence.json
      V2_GENERATION_CONCURRENCY: "10"
      V2_UPLOAD_CONCURRENCY: "4"
      V2_TICK_MS: "1000"
    volumes:
      - /opt/moling-v1/v2-evidence.json:/app/v2-evidence.json:ro
      - /opt/moling-v1/v1-data:/app/server/data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"const ioredis=require('ioredis');const r=new ioredis({host:'redis',port:6379});r.ping().then(()=>{r.disconnect();process.exit(0)}).catch(()=>process.exit(1))\" 2>/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 2G
        reservations:
          cpus: "1"
          memory: 512M

  # ── Nginx Load Balancer ──
  nginx:
    image: nginx:1.27-alpine
    container_name: moling-v1-lb
    depends_on:
      api-01:
        condition: service_healthy
      api-02:
        condition: service_healthy
      # api-03:
      #   condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx-production.conf:/etc/nginx/nginx.conf:ro
      - /opt/moling-v1/nginx-logs:/var/log/nginx
      - /opt/moling-v1/nginx-ssl:/etc/nginx/ssl
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost/lb/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 256M
        reservations:
          cpus: "0.25"
          memory: 64M

networks:
  default:
    external:
      name: moling_default
