# Nginx LB config for distributed staging
# Round-robin across API nodes; no sticky sessions required.
worker_processes 1;
error_log /dev/stdout info;

events {
    worker_connections 1024;
}

http {
    upstream api_backend {
        # Round-robin with passive health checks (failover on consecutive failures)
        server api-01:3001 max_fails=3 fail_timeout=30s;
        server api-02:3001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # LB internal health check
        location /lb/health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
        }

        # Pass through to API nodes
        location / {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";

            # Proxy timeouts for long-running operations
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # SSE support (long-lived connections)
            location ~* ^/api/(sse|stream) {
                proxy_buffering off;
                proxy_cache off;
                proxy_read_timeout 86400s;
                proxy_send_timeout 86400s;
            }

            # Error handling
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;
        }
    }
}
