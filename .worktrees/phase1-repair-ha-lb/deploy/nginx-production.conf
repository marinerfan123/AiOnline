# Production Load Balancer Configuration for Multi-Replica Deployment
#
# This config is designed for production HA deployment with:
# - Multiple API replicas behind nginx LB
# - Passive health checks for upstream failure detection
# - SSE support for real-time events
# - Security headers and rate limiting
#
# Usage:
#   docker run -d --name moling-lb \
#     -p 80:80 -p 443:443 \
#     -v /path/to/nginx-production.conf:/etc/nginx/nginx.conf:ro \
#     nginx:1.27-alpine
#
# For Kubernetes, use as ConfigMap mounted at /etc/nginx/nginx.conf

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 1000;
    types_hash_max_size 2048;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml application/xml+rss text/javascript;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/s;

    # ── Upstream: API Backend (multi-replica) ──
    upstream api_backend {
        # Add/remove API replicas here as needed
        # Pattern: server <hostname|ip>:3001 [options];
        server api-01:3001 max_fails=3 fail_timeout=30s;
        server api-02:3001 max_fails=3 fail_timeout=30s;
        # server api-03:3001 max_fails=3 fail_timeout=30s;  # Scale as needed
        # server api-04:3001 max_fails=3 fail_timeout=30s;

        # Connection pooling
        keepalive 64;
        keepalive_timeout 60s;
        keepalive_requests 100;
    }

    # ── Server Block ──
    server {
        listen 80;
        # listen 443 ssl http2;  # Enable for HTTPS
        # ssl_certificate /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols TLSv1.2 TLSv1.3;
        server_name _;

        client_max_body_size 50m;
        client_body_timeout 60s;
        client_header_timeout 60s;

        # Security headers
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

        # ── Health Check Endpoint (for orchestrator/LB probes) ──
        location = /lb/health {
            access_log off;
            return 200 'ok';
            add_header Content-Type text/plain;
            add_header Cache-Control no-cache;
        }

        # ── API Health (liveness probe) ──
        location = /api/healthz {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ── Readiness Probe ──
        location = /api/readiness {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # ── Auth Endpoints (strict rate limiting) ──
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Upload Endpoints (rate limited) ──
        location /api/upload {
            limit_req zone=upload_limit burst=10 nodelay;
            limit_req_status 429;
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── API Endpoints (general rate limiting) ──
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            limit_req_status 429;

            # Timeouts
            proxy_connect_timeout 10s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Error handling
            proxy_next_upstream error timeout http_502 http_503 http_504;
            proxy_next_upstream_tries 2;

            proxy_pass http://api_backend;
        }

        # ── SSE/Stream Endpoints (long-lived connections) ──
        location ~* ^/api/(sse|stream) {
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # SSE specific settings
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;

            # Error handling
            proxy_next_upstream error timeout http_502 http_503 http_504;
        }

        # ── Static Assets ──
        location /static/ {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Cache static assets
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        # ── Frontend ──
        location / {
            proxy_pass http://api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── Error Pages ──
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ── HTTP to HTTPS Redirect (uncomment for production) ──
    # server {
    #     listen 80;
    #     server_name yourdomain.com;
    #     return 301 https://$host$request_uri;
    # }
}
