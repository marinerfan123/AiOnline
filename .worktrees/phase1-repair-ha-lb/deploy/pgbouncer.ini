; deploy/pgbouncer.ini — Phase 0 可选连接池（高并发 >500 时启用）
; 用法：docker compose -f docker-compose.pgbouncer.yml up -d
; 说明：transaction 池模式下，应用侧 Node pg 用普通 pool.query 即可（短事务友好）

[databases]
huabu = host=postgres port=5432 dbname=huabu

[pgbouncer]
listen_addr  = 0.0.0.0
listen_port  = 6432
auth_type    = md5
auth_file    = /etc/pgbouncer/userlist.txt
pool_mode    = transaction
max_client_conn = 1000
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
server_idle_timeout = 60
log_connections = 1
log_disconnections = 1
admin_users = postgres
