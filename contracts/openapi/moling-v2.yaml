openapi: 3.1.0
info:
  title: Moling V2 API Contract (foundation)
  version: 0.1.0
  description: >
    Contract-first slice for M00 + M01-S. Proves the schema -> validation -> generated
    typed-client workflow on low-risk endpoints before scaling. Architecture
    target is OpenAPI; tooling (openapi-typescript 7.13) consumes 3.1, so we
    emit 3.1.0. Endpoints added here must already exist on the production API.
  x-owner: moling-v2
servers:
  - url: /
    description: Same-origin (production)
tags:
  - name: platform
  - name: auth
  - name: workspace
  - name: project
paths:
  /api/healthz:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Liveness + CPU shedding signal
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/readiness:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: Readiness (DB/Redis up)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current session user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: No session
  /api/v2/workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      summary: List workspaces the current user is a member of
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          description: Unauthorized
  /api/v2/projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: List projects with pagination and filters
      security:
        - cookieAuth: []
      parameters:
        - { name: workspace, in: query, required: false, schema: { type: string }, description: filter by workspace id }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, active, archived] }, description: filter by status }
        - { name: projectType, in: query, required: false, schema: { type: string, enum: [general, studio, short_drama] }, description: filter by project type }
        - { name: search, in: query, required: false, schema: { type: string }, description: search by name or description }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 }, description: page size }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 }, description: page offset }
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          description: Unauthorized
    post:
      tags: [project]
      operationId: createProject
      summary: Create a new project
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v2/projects/{projectId}:
    get:
      tags: [project]
      operationId: getProject
      summary: Get project detail and permissions
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      tags: [project]
      operationId: updateProject
      summary: Update project metadata
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v2/projects/{projectId}/archive:
    post:
      tags: [project]
      operationId: archiveProject
      summary: Archive a project
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Archived project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v2/projects/{projectId}/restore:
    post:
      tags: [project]
      operationId: restoreProject
      summary: Restore an archived project
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Restored project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    Health:
      type: object
      additionalProperties: true
      description: "Liveness + CPU shedding signal. Real shape: /api/healthz"
      properties:
        status:
          type: string
          example: ok
        pg:
          type: boolean
        redis:
          type: boolean
        node_id:
          type: string
        uptime:
          type: number
        version:
          type: string
        ts:
          type: number
        ok:
          type: boolean
          description: compatibility alias for status=ok
        cpu:
          type: object
          additionalProperties: true
          properties:
            percent:
              type: number
            shedding:
              type: boolean
    Readiness:
      type: object
      additionalProperties: true
      description: "Real shape: /api/readiness"
      properties:
        status:
          type: string
          example: ready
        pg:
          type: boolean
        redis:
          type: boolean
        node_id:
          type: string
        ready:
          type: boolean
          description: derived (status === 'ready'); kept for compat
    MeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [user, admin, system]
        credits:
          type: number
        createdAt:
          type: string
          format: date-time
    WorkspaceSummary:
      type: object
      required: [id, name, ownerId, role, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceListResponse:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    ProjectSummary:
      type: object
      required: [id, workspaceId, ownerId, name, projectType, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        projectType: { type: string, enum: [general, studio, short_drama] }
        status: { type: string, enum: [draft, active, archived] }
        coverAssetId: { type: ['string', 'null'] }
        version: { type: integer }
        archivedAt: { type: ['string', 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectDetail:
      type: object
      required: [project, permissions]
      properties:
        project:
          $ref: '#/components/schemas/ProjectSummary'
        permissions:
          $ref: '#/components/schemas/ProjectPermissions'
    ProjectListResponse:
      type: object
      required: [projects, pagination]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        pagination:
          type: object
          required: [limit, offset, total, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
            hasMore: { type: boolean }
    CreateProjectRequest:
      type: object
      required: [workspaceId, name]
      properties:
        workspaceId: { type: string }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        projectType:
          type: string
          enum: [general, studio, short_drama]
          default: general
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        projectType:
          type: string
          enum: [general, studio, short_drama]
        coverAssetId: { type: ['string', 'null'] }
    ProjectPermissions:
      type: object
      required: [role, canRead, canUpdate, canArchive, canRestore, canDelete]
      properties:
        role: { type: string, enum: [owner, member] }
        canRead: { type: boolean }
        canUpdate: { type: boolean }
        canArchive: { type: boolean }
        canRestore: { type: boolean }
        canDelete: { type: boolean }
