openapi: 3.1.0
info:
  title: Moling V2 API Contract (foundation)
  version: 0.1.0
  description: >
    Contract-first slice for M00 + M01-S. Proves the schema -> validation -> generated
    typed-client workflow on low-risk endpoints before scaling. Architecture
    target is OpenAPI; tooling (openapi-typescript 7.13) consumes 3.1, so we
    emit 3.1.0. Endpoints added here must already exist on the production API.
  x-owner: moling-v2
servers:
  - url: /
    description: Same-origin (production)
tags:
  - name: platform
  - name: auth
  - name: workspace
  - name: project
paths:
  /api/healthz:
    get:
      tags: [platform]
      operationId: getHealth
      summary: Liveness + CPU shedding signal
      security: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/readiness:
    get:
      tags: [platform]
      operationId: getReadiness
      summary: Readiness (DB/Redis up)
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Not ready
  /api/auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current session user
      security:
        - cookieAuth: []
        - bearerAuth: []
      responses:
        '200':
          description: Session user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: No session
  /api/v2/workspaces:
    get:
      tags: [workspace]
      operationId: listWorkspaces
      summary: List workspaces the current user is a member of
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Workspaces
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkspaceListResponse'
        '401':
          description: Unauthorized
  /api/v2/projects:
    get:
      tags: [project]
      operationId: listProjects
      summary: List projects with pagination and filters
      security:
        - cookieAuth: []
      parameters:
        - { name: workspace, in: query, required: false, schema: { type: string }, description: filter by workspace id }
        - { name: status, in: query, required: false, schema: { type: string, enum: [draft, active, archived] }, description: filter by status }
        - { name: projectType, in: query, required: false, schema: { type: string, enum: [general, studio, short_drama] }, description: filter by project type }
        - { name: search, in: query, required: false, schema: { type: string }, description: search by name or description }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 }, description: page size }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 }, description: page offset }
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectListResponse'
        '401':
          description: Unauthorized
    post:
      tags: [project]
      operationId: createProject
      summary: Create a new project
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /api/v2/projects/{projectId}:
    get:
      tags: [project]
      operationId: getProject
      summary: Get project detail and permissions
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Project detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
    patch:
      tags: [project]
      operationId: updateProject
      summary: Update project metadata
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProjectRequest'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v2/projects/{projectId}/archive:
    post:
      tags: [project]
      operationId: archiveProject
      summary: Archive a project
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Archived project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v2/projects/{projectId}/restore:
    post:
      tags: [project]
      operationId: restoreProject
      summary: Restore an archived project
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Restored project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Not found
  /api/v2/projects/{projectId}/assets:
    get:
      tags: [asset]
      operationId: listProjectAssets
      summary: List assets attached to a project (paginated, filterable)
      security:
        - cookieAuth: []
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: type, in: query, required: false, schema: { type: string, enum: [IMAGE, VIDEO, AUDIO, OTHER] }, description: filter by asset type }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PROCESSING, READY, FAILED, ARCHIVED] }, description: filter by asset status }
        - { name: search, in: query, required: false, schema: { type: string }, description: search by title or prompt }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 }, description: page size }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 }, description: page offset }
      responses:
        '200':
          description: Project assets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Project not found
  /api/v2/assets:
    get:
      tags: [asset]
      operationId: listMyAssets
      summary: List the current user's assets (paginated, filterable)
      security:
        - cookieAuth: []
      parameters:
        - { name: type, in: query, required: false, schema: { type: string, enum: [IMAGE, VIDEO, AUDIO, OTHER] } }
        - { name: status, in: query, required: false, schema: { type: string, enum: [PROCESSING, READY, FAILED, ARCHIVED] } }
        - { name: search, in: query, required: false, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200':
          description: Asset list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetListResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
    post:
      tags: [asset]
      operationId: createOrRegisterAsset
      summary: Provision a new durable asset into a project, or re-scope an existing asset
      description: >
        With `url` in the body a new media row is created (durable asset
        authority = media table). With `assetId` an existing media row owned
        by the caller is attached to the project. The Asset identity is the
        assetId (media.id) — never a provider temporary URL.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetWriteRequest'
      responses:
        '200':
          description: Registered asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailResponse'
        '201':
          description: Created asset
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailResponse'
        '400':
          description: Validation error
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Asset or project not found
  /api/v2/assets/{assetId}:
    get:
      tags: [asset]
      operationId: getAsset
      summary: Asset detail with provenance summary
      security:
        - cookieAuth: []
      parameters:
        - { name: assetId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Asset detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssetDetailResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
        '404':
          description: Asset not found

  /api/v2/projects/{projectId}/studio/canvas:
    get:
      tags: [studio]
      operationId: getStudioCanvas
      summary: Load primary Studio canvas graph
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '200': { description: Studio canvas, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasResponse' } } } }
    post:
      tags: [studio]
      operationId: createStudioCanvas
      summary: Create idempotent primary Studio canvas
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasResponse' } } } }
        '200': { description: Already exists, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasResponse' } } } }
    patch:
      tags: [studio]
      operationId: patchStudioCanvas
      summary: Apply transactional incremental canvas patch with optimistic concurrency
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/CanvasPatchRequest' } } } }
      responses:
        '200': { description: Patched, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasResponse' } } } }
        '409': { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/CanvasConflictResponse' } } } }
  /api/v2/projects/{projectId}/studio/canvas/versions:
    get:
      tags: [studio]
      operationId: listStudioCanvasVersions
      summary: List Studio canvas immutable snapshots
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: limit, in: query, required: false, schema: { type: integer, default: 20, maximum: 100 } }
        - { name: offset, in: query, required: false, schema: { type: integer, default: 0 } }
      responses:
        '200': { description: Versions, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasVersionListResponse' } } } }
    post:
      tags: [studio]
      operationId: createStudioCanvasVersion
      summary: Create immutable Studio canvas snapshot
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
      requestBody: { required: false, content: { application/json: { schema: { $ref: '#/components/schemas/CreateCanvasVersionRequest' } } } }
      responses:
        '201': { description: Version, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasVersionResponse' } } } }
  /api/v2/projects/{projectId}/studio/canvas/versions/{versionId}/restore:
    post:
      tags: [studio]
      operationId: restoreStudioCanvasVersion
      summary: Restore snapshot into current canvas with monotonic revision
      security: [{ cookieAuth: [] }]
      parameters:
        - { name: projectId, in: path, required: true, schema: { type: string } }
        - { name: versionId, in: path, required: true, schema: { type: string } }
      requestBody: { required: true, content: { application/json: { schema: { $ref: '#/components/schemas/RestoreCanvasVersionRequest' } } } }
      responses:
        '200': { description: Restored, content: { application/json: { schema: { $ref: '#/components/schemas/StudioCanvasResponse' } } } }
        '409': { description: Conflict, content: { application/json: { schema: { $ref: '#/components/schemas/CanvasConflictResponse' } } } }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sid
    bearerAuth:
      type: http
      scheme: bearer
  schemas:

    StudioCanvasViewport:
      type: object
      required: [x, y, zoom]
      properties: { x: { type: number }, y: { type: number }, zoom: { type: number } }
    StudioCanvasNode:
      type: object
      required: [nodeId, nodeType, nodeSchemaVersion, position, data]
      properties:
        nodeId: { type: string }
        nodeType: { type: string }
        nodeSchemaVersion: { type: integer, minimum: 1 }
        position: { type: object, required: [x, y], properties: { x: { type: number }, y: { type: number } } }
        size: { type: object, properties: { width: { type: [number, 'null'] }, height: { type: [number, 'null'] } } }
        zIndex: { type: [integer, 'null'] }
        data: { type: object, additionalProperties: true }
    StudioCanvasEdge:
      type: object
      required: [edgeId, sourceNodeId, targetNodeId, data]
      properties:
        edgeId: { type: string }
        sourceNodeId: { type: string }
        sourceHandle: { type: [string, 'null'] }
        targetNodeId: { type: string }
        targetHandle: { type: [string, 'null'] }
        edgeType: { type: [string, 'null'] }
        data: { type: object, additionalProperties: true }
    StudioCanvas:
      type: object
      required: [id, projectId, workspaceId, name, revision, schemaVersion, createdAt, updatedAt]
      properties:
        id: { type: string }
        projectId: { type: string }
        workspaceId: { type: string }
        name: { type: string }
        revision: { type: integer, minimum: 1 }
        schemaVersion: { type: integer, minimum: 1 }
        archivedAt: { type: [string, 'null'] }
        createdAt: { type: [string, 'null'] }
        updatedAt: { type: [string, 'null'] }
        restoredFromVersionId: { type: [string, 'null'] }
    StudioCanvasResponse:
      type: object
      required: [canvas, nodes, edges, viewport]
      properties:
        canvas: { anyOf: [{ $ref: '#/components/schemas/StudioCanvas' }, { type: 'null' }] }
        nodes: { type: array, items: { $ref: '#/components/schemas/StudioCanvasNode' } }
        edges: { type: array, items: { $ref: '#/components/schemas/StudioCanvasEdge' } }
        viewport: { anyOf: [{ $ref: '#/components/schemas/StudioCanvasViewport' }, { type: 'null' }] }
        permissions: { $ref: '#/components/schemas/ProjectPermissions' }
    CanvasPatchRequest:
      type: object
      required: [baseRevision, clientMutationId]
      properties:
        baseRevision: { type: integer, minimum: 1 }
        clientMutationId: { type: string }
        upsertNodes: { type: array, items: { $ref: '#/components/schemas/StudioCanvasNode' } }
        deleteNodeIds: { type: array, items: { type: string } }
        upsertEdges: { type: array, items: { $ref: '#/components/schemas/StudioCanvasEdge' } }
        deleteEdgeIds: { type: array, items: { type: string } }
        viewport: { $ref: '#/components/schemas/StudioCanvasViewport' }
    CanvasConflictResponse:
      type: object
      required: [error, serverRevision, canvasId]
      properties: { error: { const: CONFLICT }, serverRevision: { type: integer }, canvasId: { type: string } }
    CanvasVersionSummary:
      type: object
      required: [id, canvasId, revision, versionNumber, createdBy, createdAt, nodeCount, edgeCount]
      properties:
        id: { type: string }
        canvasId: { type: string }
        revision: { type: integer }
        versionNumber: { type: integer }
        name: { type: [string, 'null'] }
        description: { type: [string, 'null'] }
        createdBy: { type: string }
        createdAt: { type: [string, 'null'] }
        restoredFromVersionId: { type: [string, 'null'] }
        nodeCount: { type: integer }
        edgeCount: { type: integer }
    StudioCanvasVersionResponse:
      type: object
      required: [version]
      properties: { version: { $ref: '#/components/schemas/CanvasVersionSummary' } }
    StudioCanvasVersionListResponse:
      type: object
      required: [versions, pagination]
      properties:
        versions: { type: array, items: { $ref: '#/components/schemas/CanvasVersionSummary' } }
        pagination: { type: object, required: [limit, offset, total, hasMore], properties: { limit: { type: integer }, offset: { type: integer }, total: { type: integer }, hasMore: { type: boolean } } }
    CreateCanvasVersionRequest:
      type: object
      properties: { name: { type: string, maxLength: 120 }, description: { type: string, maxLength: 1000 } }
    RestoreCanvasVersionRequest:
      type: object
      required: [baseRevision]
      properties: { baseRevision: { type: integer, minimum: 1 } }
    Health:
      type: object
      additionalProperties: true
      description: "Liveness + CPU shedding signal. Real shape: /api/healthz"
      properties:
        status:
          type: string
          example: ok
        pg:
          type: boolean
        redis:
          type: boolean
        node_id:
          type: string
        uptime:
          type: number
        version:
          type: string
        ts:
          type: number
        ok:
          type: boolean
          description: compatibility alias for status=ok
        cpu:
          type: object
          additionalProperties: true
          properties:
            percent:
              type: number
            shedding:
              type: boolean
    Readiness:
      type: object
      additionalProperties: true
      description: "Real shape: /api/readiness"
      properties:
        status:
          type: string
          example: ready
        pg:
          type: boolean
        redis:
          type: boolean
        node_id:
          type: string
        ready:
          type: boolean
          description: derived (status === 'ready'); kept for compat
    MeResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/User'
            - type: 'null'
    User:
      type: object
      required: [id, email, role]
      properties:
        id:
          type: string
        email:
          type: string
          format: email
        displayName:
          type: string
        role:
          type: string
          enum: [user, admin, system]
        credits:
          type: number
        createdAt:
          type: string
          format: date-time
    WorkspaceSummary:
      type: object
      required: [id, name, ownerId, role, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        ownerId: { type: string }
        role: { type: string, enum: [owner, member] }
        status: { type: string, enum: [active, suspended] }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    WorkspaceListResponse:
      type: object
      required: [workspaces]
      properties:
        workspaces:
          type: array
          items:
            $ref: '#/components/schemas/WorkspaceSummary'
    ProjectSummary:
      type: object
      required: [id, workspaceId, ownerId, name, projectType, status, createdAt, updatedAt]
      properties:
        id: { type: string }
        workspaceId: { type: string }
        ownerId: { type: string }
        name: { type: string }
        description: { type: string }
        projectType: { type: string, enum: [general, studio, short_drama] }
        status: { type: string, enum: [draft, active, archived] }
        coverAssetId: { type: ['string', 'null'] }
        version: { type: integer }
        archivedAt: { type: ['string', 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectDetail:
      type: object
      required: [project, permissions]
      properties:
        project:
          $ref: '#/components/schemas/ProjectSummary'
        permissions:
          $ref: '#/components/schemas/ProjectPermissions'
    ProjectListResponse:
      type: object
      required: [projects, pagination]
      properties:
        projects:
          type: array
          items:
            $ref: '#/components/schemas/ProjectSummary'
        pagination:
          type: object
          required: [limit, offset, total, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
            hasMore: { type: boolean }
    CreateProjectRequest:
      type: object
      required: [workspaceId, name]
      properties:
        workspaceId: { type: string }
        name: { type: string, maxLength: 200 }
        description: { type: string }
        projectType:
          type: string
          enum: [general, studio, short_drama]
          default: general
    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string, maxLength: 200 }
        description: { type: string }
        projectType:
          type: string
          enum: [general, studio, short_drama]
        coverAssetId: { type: ['string', 'null'] }
    ProjectPermissions:
      type: object
      required: [role, canRead, canUpdate, canArchive, canRestore, canDelete]
      properties:
        role: { type: string, enum: [owner, member] }
        canRead: { type: boolean }
        canUpdate: { type: boolean }
        canArchive: { type: boolean }
        canRestore: { type: boolean }
        canDelete: { type: boolean }
    # ── M04-S Asset Foundation ──────────────────────────────────────────────
    AssetType:
      type: string
      enum: [IMAGE, VIDEO, AUDIO, OTHER]
      description: Normalized asset type (projected from media.type/mime_type).
    AssetStatus:
      type: string
      enum: [PROCESSING, READY, FAILED, ARCHIVED]
      description: Projected from media.status/is_deleted (authority stays in media).
    AssetOrigin:
      type: string
      enum: [UPLOAD, GENERATION, IMPORT, DERIVED]
      description: Minimum provenance; full lineage graph is a later Studio concern.
    AssetRef:
      type: object
      description: >
        The stable, permanent reference to an asset. Canvas nodes and Studio
        contracts MUST store assetId (media.id) — never provider temporary
        URLs, signed URLs, base64 payloads, or storage credentials.
      required: [assetId, workspaceId, projectId, ownerId, assetType, mimeType, status, storageProvider, width, height, durationMs, sizeBytes, title, url, thumbnailUrl, origin, createdAt, updatedAt]
      properties:
        assetId: { type: string }
        workspaceId: { type: ['string', 'null'] }
        projectId: { type: ['string', 'null'] }
        ownerId: { type: ['string', 'null'] }
        assetType: { $ref: '#/components/schemas/AssetType' }
        mimeType: { type: ['string', 'null'] }
        status: { $ref: '#/components/schemas/AssetStatus' }
        storageProvider:
          type: string
          enum: [oss, provider]
        width: { type: ['integer', 'null'] }
        height: { type: ['integer', 'null'] }
        durationMs: { type: ['integer', 'null'] }
        sizeBytes: { type: ['integer', 'null'] }
        title: { type: string }
        url:
          type: string
          description: Resolved preview URL (may be empty when storage is disabled). Not an identity.
        thumbnailUrl:
          type: string
          description: Resolved thumbnail (image thumb / video snapshot). Empty until resolution available.
        origin: { $ref: '#/components/schemas/AssetOrigin' }
        createdAt: { type: ['string', 'null'], format: date-time }
        updatedAt: { type: ['string', 'null'], format: date-time }
    AssetSummary:
      allOf:
        - $ref: '#/components/schemas/AssetRef'
    AssetProvenanceSummary:
      type: object
      required: [origin, generationTaskId, generationBatchId, prompt, model]
      properties:
        origin: { $ref: '#/components/schemas/AssetOrigin' }
        generationTaskId: { type: ['string', 'null'] }
        generationBatchId: { type: ['string', 'null'] }
        prompt: { type: ['string', 'null'] }
        model: { type: ['string', 'null'] }
    AssetDetail:
      allOf:
        - $ref: '#/components/schemas/AssetRef'
        - type: object
          required: [ratio, tags, isFavorite, ossUploaded, errorMessage, failedAt, provenance]
          properties:
            ratio: { type: ['string', 'null'] }
            tags:
              type: array
              items: { type: string }
            isFavorite: { type: boolean }
            ossUploaded: { type: boolean }
            errorMessage: { type: ['string', 'null'] }
            failedAt: { type: ['string', 'null'], format: date-time }
            provenance:
              $ref: '#/components/schemas/AssetProvenanceSummary'
    AssetListResponse:
      type: object
      required: [assets, pagination]
      properties:
        projectId: { type: ['string', 'null'] }
        assets:
          type: array
          items:
            $ref: '#/components/schemas/AssetSummary'
        pagination:
          type: object
          required: [limit, offset, total, hasMore]
          properties:
            limit: { type: integer }
            offset: { type: integer }
            total: { type: integer }
            hasMore: { type: boolean }
    AssetDetailResponse:
      type: object
      required: [asset]
      properties:
        asset:
          $ref: '#/components/schemas/AssetDetail'
    AssetWriteRequest:
      type: object
      description: >
        Exactly one write mode: `url` present → provision a new asset;
        `assetId` present → re-scope an existing caller-owned asset.
      required: [projectId]
      properties:
        projectId: { type: string }
        assetId: { type: string }
        url:
          type: string
          description: Public http(s) source URL for a newly provisioned asset.
        title: { type: string, maxLength: 200 }
        assetType: { $ref: '#/components/schemas/AssetType' }
        mimeType: { type: string, maxLength: 100 }
        width: { type: integer }
        height: { type: integer }
        durationMs: { type: integer }
        sizeBytes: { type: integer }
