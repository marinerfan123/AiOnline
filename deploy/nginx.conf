# deploy/nginx.conf — Phase 0 反向代理 + 限流 + 健康检查
# 用法：把本文件放到 /etc/nginx/conf.d/ 或 include 进 nginx.conf 的 http 块
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # 压缩（前端静态资源 + JSON）
    gzip on;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # ── 限流区 ──
    # auth：严格，防爆破/注册机；api：宽松，普通业务
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:20m rate=50r/s;

    # ── 上游（Node 服务，Cluster 模式下多进程共用同一端口）──
    upstream app_backend {
        server 127.0.0.1:3001;
        keepalive 32;
    }

    # ── 全局安全响应头 ──
    # 与后端 applySecurityHeaders 双保险（此处覆盖反代场景）
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https:; media-src 'self' blob: https:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    server {
        listen 80;
        server_name _;  # 改成你的域名，如 studio.example.com

        # 健康检查直通：不过限流，便于 nginx/容器探针
        location = /api/healthz {
            proxy_pass http://app_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            access_log off;
        }

        # 认证接口：严格限流
        location /api/auth/ {
            limit_req zone=auth_limit burst=20 nodelay;
            proxy_pass http://app_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 通用 API：宽松限流
        location /api/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://app_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端（Node 同源托管 dist/build2；大文件上传放宽到 50m）
        location / {
            client_max_body_size 50m;
            proxy_pass http://app_backend;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # ── 可选 HTTPS（启用后把 listen 80 改为 443 并 redirect）──
        # listen 443 ssl;
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_session_cache   shared:SSL:10m;
        # if ($scheme = http) { return 301 https://$host$request_uri; }
    }
}
